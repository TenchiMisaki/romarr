<text x="286" y="759" font-family="Consolas,monospace" font-size="12.2" fill="#c6cad4" font-weight="400">Use the existing Docker deployment or host-side updater; verify the image source and chosen tag.</text>
<text x="286" y="784" font-family="Consolas,monospace" font-size="12.2" fill="#c6cad4" font-weight="400">Preserve volumes, credentials, ports, and rollback information. Do not delete/recreate blindly.</text>
