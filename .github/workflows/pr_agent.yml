name: AI PR review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.repository == 'TenchiMisaki/romarr' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      ollama:
        image: ollama/ollama
        env:
          OLLAMA_CONTEXT_LENGTH: "16384"
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Download the code review model
        shell: bash
        run: docker exec "${{ job.services.ollama.id }}" ollama pull qwen2.5-coder:7b
      - name: Review the pull request
        uses: The-PR-Agent/pr-agent@v0.47.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.model: "ollama/qwen2.5-coder:7b"
          config.fallback_models: "[]"
          config.custom_model_max_tokens: "16384"
          config.ai_timeout: "300"
          config.duplicate_prompt_examples: "true"
          ollama.api_base: "http://ollama:11434"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
          github_action_config.auto_describe: "true"
